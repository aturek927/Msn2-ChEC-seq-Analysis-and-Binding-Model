[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "dna_conformation_predictors"
version="0.1.0"
description="A modified LightGBM predictor from Gupta et al. (2021) that predicts DNA conformation from sequence alone"
requires-python=">=3.12"
dependencies=["lightgbm>=4.0.0",
"numpy>=2.0.0",
"scipy",
"matplotlib",
"pathlib",
"dill",
"scikit-learn",
"pandas"]

[tool.hatch.build.targets.wheel]
packages=["src/dna_conformation_predictors"]
artifacts=["src/dna_conformation_predictors/*.txt","src/dna_conformation_predictors/*.pkl"]

[tool.hatch.build.targets.sdst]
include=["src/dna_conformation_predictors"]
